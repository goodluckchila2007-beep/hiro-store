<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — Hiro Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                radial-gradient(circle at top,
                    rgba(255, 152, 0, 0.10),
                    transparent 35%),
                linear-gradient(135deg,
                    #090909,
                    #111111,
                    #080808);

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =====================================================
           RESET CARD
        ===================================================== */

        .reset-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .reset-card {
            position: relative;

            padding: 32px 28px 30px;

            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025));

            border: 1px solid rgba(255, 152, 0, 0.20);

            border-radius: 22px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            overflow: hidden;
        }

        .reset-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 4px;

            background:
                linear-gradient(90deg,
                    #ff9800,
                    #ff5722);

            box-shadow:
                0 0 18px rgba(255, 152, 0, 0.45);
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .reset-brand {
            text-align: center;

            color: #ff9800;

            font-size: 13px;
            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 8px;
        }

        .reset-title {
            margin: 0;

            text-align: center;

            font-size: 27px;
            font-weight: 850;

            color: #fff;
        }

        .reset-subtitle {
            margin: 10px auto 25px;

            max-width: 330px;

            text-align: center;

            color: #999;

            font-size: 13px;
            line-height: 1.6;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .reset-field {
            display: block;
        }

        .reset-field span {
            display: block;

            margin-bottom: 7px;

            color: #aaa;

            font-size: 12px;
            font-weight: 700;
        }

        .reset-field input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 11px;

            border: 1px solid rgba(255, 255, 255, 0.10);

            outline: none;

            background:
                rgba(0, 0, 0, 0.28);

            color: #fff;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .reset-field input::placeholder {
            color: #666;
        }

        .reset-field input:focus {
            border-color:
                rgba(255, 152, 0, 0.65);

            background:
                rgba(0, 0, 0, 0.38);

            box-shadow:
                0 0 0 3px rgba(255, 152, 0, 0.08);
        }

        /* =====================================================
           PASSWORD REQUIREMENTS
        ===================================================== */

        .password-hint {
            margin-top: -5px;

            color: #777;

            font-size: 11px;
            line-height: 1.5;
        }

        /* =====================================================
           RESET BUTTON
        ===================================================== */

        .reset-password-btn {
            width: 100%;

            margin-top: 5px;

            padding: 14px 16px;

            border: none;
            border-radius: 11px;

            background:
                linear-gradient(135deg,
                    #ff9800,
                    #ff5722);

            color: #fff;

            font-size: 14px;
            font-weight: 850;

            cursor: pointer;

            box-shadow:
                0 9px 24px rgba(255, 87, 34, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .reset-password-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 30px rgba(255, 87, 34, 0.32);
        }

        .reset-password-btn:active {
            transform: translateY(0);
        }

        .reset-password-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* =====================================================
           BACK TO LOGIN
        ===================================================== */

        .back-login-btn {
            width: 100%;

            margin-top: 12px;

            padding: 12px 16px;

            border-radius: 11px;

            border: 1px solid rgba(255, 152, 0, 0.22);

            background:
                rgba(255, 255, 255, 0.035);

            color: #ffb74d;

            font-size: 13px;
            font-weight: 750;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        .back-login-btn:hover {
            background:
                rgba(255, 152, 0, 0.08);

            border-color:
                rgba(255, 152, 0, 0.45);

            color: #fff;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .reset-message {
            display: none;

            margin-top: 16px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 12px;
            line-height: 1.5;

            text-align: center;
        }

        .reset-message.error {
            display: block;

            color: #fecaca;

            background:
                rgba(239, 68, 68, 0.10);

            border: 1px solid rgba(239, 68, 68, 0.22);
        }

        .reset-message.success {
            display: block;

            color: #bbf7d0;

            background:
                rgba(34, 197, 94, 0.10);

            border: 1px solid rgba(34, 197, 94, 0.22);
        }

        /* =====================================================
           LOADING / INVALID TOKEN
        ===================================================== */

        .reset-state {
            text-align: center;
        }

        .reset-state p {
            color: #999;

            font-size: 13px;
            line-height: 1.6;
        }

        .reset-state strong {
            color: #fff;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        #toastContainer {
            position: fixed;

            top: 20px;
            right: 20px;

            z-index: 999999;

            display: flex;
            flex-direction: column;

            gap: 12px;

            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            max-width: 380px;

            padding: 15px 20px;

            border-radius: 12px;

            color: #fff;

            font-weight: 600;
            font-size: 13px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.35);

            transform: translateX(120%);
            opacity: 0;

            transition: 0.35s;

            pointer-events: auto;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            background:
                linear-gradient(135deg,
                    #22c55e,
                    #16a34a);
        }

        .toast.error {
            background:
                linear-gradient(135deg,
                    #ef4444,
                    #dc2626);
        }

        .toast.warning {
            background:
                linear-gradient(135deg,
                    #f59e0b,
                    #d97706);
        }

        .toast.info {
            background:
                linear-gradient(135deg,
                    #3b82f6,
                    #2563eb);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 16px;
            }

            .reset-card {
                padding:
                    28px 20px 24px;

                border-radius: 19px;
            }

            .reset-title {
                font-size: 24px;
            }

            .reset-subtitle {
                font-size: 12px;
            }

            #toastContainer {
                top: 12px;
                left: 12px;
                right: 12px;
            }

            .toast {
                min-width: 0;
                width: 100%;
                max-width: none;

                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="reset-wrapper">

        <section class="reset-card">

            <div class="reset-brand">
                Hiro Store
            </div>

            <h1 class="reset-title">
                Reset Password
            </h1>

            <p class="reset-subtitle">
                Enter a new password for your Hiro Store
                account.
            </p>


            <!-- =================================================
                 RESET FORM
            ================================================== -->

            <form class="reset-form" id="resetPasswordForm" novalidate>

                <label class="reset-field">

                    <span>
                        New Password
                    </span>

                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password"
                        autocomplete="new-password" minlength="8" required>

                </label>


                <label class="reset-field">

                    <span>
                        Confirm Password
                    </span>

                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm new password" autocomplete="new-password" minlength="8" required>

                </label>


                <div class="password-hint">
                    Password must be at least 8 characters.
                </div>


                <button type="submit" class="reset-password-btn" id="resetPasswordButton">
                    Reset Password
                </button>


                <button type="button" class="back-login-btn" id="backLoginButton">
                    Back to Login
                </button>

            </form>


            <!-- =================================================
                 MESSAGE AREA
            ================================================== -->

            <div class="reset-message" id="resetMessage" role="alert" aria-live="polite"></div>


            <!-- =================================================
                 SUCCESS STATE
            ================================================== -->

            <div class="reset-state" id="successState" style="display: none;">

                <p>
                    Your password has been
                    <strong>successfully changed.</strong>
                </p>

                <button type="button" class="reset-password-btn" id="successLoginButton">
                    Go to Login
                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         TOAST CONTAINER
    ========================================================= -->

    <div id="toastContainer"></div>


    <script src="reset-password.js" defer></script>

</body>

</html>
