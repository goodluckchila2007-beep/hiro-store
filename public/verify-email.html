<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Hiro Store</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #090b14;
            --text: #eef1ff;
            --muted: #aab2d0;
            --accent: #7c5cff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.6 Arial, sans-serif;
            padding: 20px;
        }

        .box {
            max-width: 420px;
            text-align: center;
            background: #121629;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 40px 28px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 12px;
        }

        p {
            color: var(--muted);
            margin: 0 0 24px;
        }

        a.button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon" id="icon">⏳</div>
        <h1 id="title">Verifying your email...</h1>
        <p id="message">Please wait a moment.</p>
        <a class="button" href="index.html" id="homeLink" style="display: none;">Back to Hiro Store</a>
    </div>

    <script src="verify-email.js" defer></script>
</body>

</html>
