<!DOCTYPE html>
<html lang="en">
<head>
     <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiro Store | Under Maintenance</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0e14;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }
    .box {
        max-width: 480px;
    }
    .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #2dd4bf, #f5a623);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 46px;
        font-weight: 900;
        color: #0a0e14;
    }
    h1 {
        font-size: 26px;
        margin: 0 0 12px;
    }
    p {
        color: rgba(255,255,255,0.65);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 10px;
    }
    .contact {
        margin-top: 24px;
        font-size: 13px;
        color: rgba(255,255,255,0.4);
    }
    .contact a {
        color: #2dd4bf;
        text-decoration: none;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">H</div>
        <h1>We'll be right back</h1>
        <p>Hiro Store is currently undergoing maintenance. We're working to get things running smoothly again.</p>
        <p>Please check back shortly.</p>
        <div class="contact">Need help? <a href="mailto:support@hirostore.site">Contact Support</a></div>
    </div>
</body>
</html>
