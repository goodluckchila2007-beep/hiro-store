<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>Hiro Store | Under Maintenance</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #0a0e14; color: #edf5f7; font-family: Arial, sans-serif; padding: 32px 20px; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 20% 20%, rgba(45,212,191,.1), transparent 48%), radial-gradient(ellipse at 85% 80%, rgba(245,166,35,.08), transparent 48%); animation: atmosphere 12s ease-in-out infinite alternate; }
.box { position: relative; width: min(100%, 520px); text-align: center; padding: 46px 32px; border: 1px solid #26363e; border-radius: 26px; background: rgba(16,24,32,.92); box-shadow: 0 24px 70px #0005; animation: entrance .7s ease-out both; }
.brand { text-transform: uppercase; letter-spacing: .24em; font-size: 11px; font-weight: bold; color: #93a9b2; margin: 0 0 32px; }
.icon { width: 84px; height: 84px; margin: 0 auto 28px; border-radius: 23px; display: grid; place-items: center; font-size: 44px; font-weight: 900; color: #102028; background: linear-gradient(135deg, #2dd4bf, #f5c56a); box-shadow: 0 0 40px #2dd4bf1a; animation: float 5s ease-in-out infinite; }
h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.2; margin: 0 0 18px; letter-spacing: -.04em; }
p { color: #a9bac3; font-size: 15px; line-height: 1.8; margin: 0 0 10px; }
.status { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; margin: 24px 0 26px; color: #83decc; background: #2dd4bf0b; border: 1px solid #2dd4bf30; border-radius: 30px; font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #2dd4bf; animation: pulse 2.4s ease-out infinite; }
.contact { border-top: 1px solid #26363e; padding-top: 23px; font-size: 13px; color: #9aadb6; }
a { color: #66e2ce; text-underline-offset: 4px; }
a:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 5px; }
@keyframes entrance { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes float { 50% { transform: translateY(-5px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 #2dd4bf50; } 80%, 100% { box-shadow: 0 0 0 8px #2dd4bf00; } }
@keyframes atmosphere { to { opacity: .55; } }
@media (max-width: 420px) { .box { padding: 36px 22px; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="box">
    <div class="brand">Hiro Store</div>
    <div class="icon" aria-hidden="true">H</div>
    <h1>We'll be right back</h1>
    <p>We're giving Hiro Store a little care.<br>Top-ups will be available again once maintenance is complete.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Maintenance in progress</div>
    <p>Please check back shortly.</p>
    <div class="contact">Need help? <a href="mailto:support@hirostore.site">Contact support</a></div>
</main>
</body>
</html>
